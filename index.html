const r=result,t=types[r.main],s=types[r.sub],max=Math.max(...Object.values(r.total),1);app.innerHTML=`<section class="result" style="--theme:${t.color};--tint:${t.tint}"><div class="toolbar"><span class="pill">你的专属关系偏好</span><button class="link" onclick="state='quiz';index=27;render()">修改答案</button></div><div class="result-hero" style="margin-top:22px"><img src="${photo}" alt="温暖明亮的居家相处空间"><span>${r.main} + ${r.sub} · ${combo[r.main+r.sub]||names[DIM.indexOf(r.main)]+'，也珍惜'+names[DIM.indexOf(r.sub)]}</span></div><h1>${r.main}型 · ${t.name}</h1><div class="tags">${t.tags.map(x=>'<span>'+x+'</span>').join('')}</div><div class="type-pair"><div class="type-card"><span class="muted">主型 · 核心期待</span><b>${r.main} ${t.name}</b></div><div class="type-card"><span class="muted">副型 · 另一面偏好</span><b>${r.sub} ${s.name}</b></div></div><div class="report"><section><h3>你是怎样的人</h3><p>${t.self}</p></section><section><h3>最适合你的伴侣</h3><p>${t.core}${t.portrait}</p></section><section class="wide"><h3>你的副型，让画像更完整</h3><p>${combo[r.main+r.sub]||'你也期待'+s.core}。除了${names[DIM.indexOf(r.main)]}，你也看重${names[DIM.indexOf(r.sub)]}：${s.portrait}</p></section><section class="wide"><h3>你的八维关系偏好</h3>${DIM.map((d,i)=>`<div class="score-row"><span>${d} · ${names[i]}</span><div class="track"><div class="fill" style="width:${r.total[d]/max*100}%"></div></div><span>${r.total[d]}</span></div>`).join('')}<p class="muted">原始偏好分，各维度题目数量不同，不代表能力或人群百分比。</p></section><section><h3>值得探索的组合</h3><p>${t.best.map(d=>r.main+'「'+t.name+'」 + '+d+'「'+types[d].name+'」：'+(combo[r.main+d]||types[d].core)).join('<br>')}</p></section><section><h3>需要多一点磨合</h3><p>与${t.caution}型「${types[t.caution].name}」相处时，${t.risk}</p></section></div><h3>给你的一句话</h3><blockquote>${t.advice}</blockquote><div class="actions"><button class="primary" onclick="downloadResult()">↓ 保存结果图</button><button class="secondary" onclick="share()">邀请 TA 来测 ↗</button></div><div class="footer">类型是理解彼此的起点，真实的人远比标签丰富。<br>娱乐与自我探索用途 · <button class="link" onclick="reset() function downloadResult(){const r=result,t=types[r.main],s=types[r.sub],c=document.createElement('canvas');c.width=900;c.height=1200;const x=c.getContext('2d');x.fillStyle='#FDF8F3';x.fillRect(0,0,900,1200);x.fillStyle=t.tint;x.fillRect(50,50,800,1100);x.textAlign='center';x.fillStyle='#9A8F86';x.font='22px sans-serif';x.fillText('心迹 / HEART NOTES',450,120);x.fillStyle='#4A4038';x.font='44px serif';x.fillText(r.main+'型 · '+t.name,450,220);x.font='24px sans-serif';x.fillText('我的理想伴侣画像',450,170);x.fillStyle=t.color;x.beginPath();x.arc(450,440,140,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='120px Georgia';x.fillText(r.main+' + '+r.sub,450,480);x.fillStyle='#4A4038';x.font='26px sans-serif';x.fillText(t.tags.join('  ·  '),450,660);x.fillText('副型：'+r.sub+' '+s.name,450,730);x.font='23px sans-serif';const sentence=combo[r.main+r.sub]||names[DIM.indexOf(r.main)]+'，也珍惜'+names[DIM.indexOf(r.sub)];x.fillText(sentence,450,800);x.strokeStyle=t.color;x.beginPath();x.moveTo(220,875);x.lineTo(680,875);x.stroke();x.font='20px sans-serif';const chars=[...t.advice];let row='',y=940;for(const char of chars){if(x.measureText(row+char).width>640){x.fillText(row,450,y);row='';y+=36;}row+=char;}x.fillText(row,450,y);x.fillStyle='#9A8F86';x.font='18px sans-serif';x.fillText('28 道题 · 8 个关系维度 · 找到舒服的相处方式',450,1080);const a=document.createElement('a');a.download='心迹-'+r.main+r.sub+'-伴侣画像.png';a.href=c.toDataURL('image/png');a.click();notify('结果图已生成');}
async function share(){const url=location.href.split('#')[0];if(location.protocol==='file:'){notify('上线后可分享页面链接；现在可以保存结果图');return;}try{if(navigator.share)await navigator.share({title:'心迹 · 找到最适合你的伴侣类型',text:'一起看看，我们期待怎样的关系？',url});else{await navigator.clipboard.writeText(url);notify('测试链接已复制');}}catch(e){if(e.name!=='AbortError')notify('暂时无法分享，请复制浏览器地址');}}
function render(){renderBase();if(state==='result'&&result){const pf=profileFor(result),t=types[result.main],s=types[result.sub],box=document.querySelector('.report');if(box){const insight=document.createElement('section');insight.className='wide';insight.innerHTML='<h3>你的专属偏科画像</h3><p><strong>「'+(comboProfile[result.main+result.sub]||t.name+' × '+s.name)+'」</strong>：'+pf.contrast+'</p>'+(pf.high.length?'<p>高分标签：'+pf.high.map(d=>'【'+d+' '+highTags[d]+'】').join('、')+'</p>':'')+(pf.low.length?'<p>提醒标签：'+pf.low.map(d=>'【'+d+' '+lowTags[d]+'】').join('、')+'</p>':'')+'<blockquote>'+pf.contrast+' 小心：'+t.risk+'</blockquote>';box.insertBefore(insight,box.firstElementChild);const heading=[...box.querySelectorAll('h3')].find(h=>h.textContent==='值得探索的组合');if(heading)heading.insertAdjacentHTML('beforebegin','<section class="wide"><h3>组合结论</h3><p>你的主型与副型共同组成「'+(comboProfile[result.main+result.sub]||t.name+' × '+s.name)+'」。这意味着：'+t.core+'同时，你也强烈在意'+names[DIM.indexOf(result.sub)]+'。同样是'+t.name+'，副型不同，关系里的优先级也会不同。</p></section>');}}}

const structuredRender=render;render=function(){structuredRender();if(state==='result'&&result){const d=dynamicResult(result),report=document.querySelector('.report');if(report){
